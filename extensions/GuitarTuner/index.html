<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyaviira Pro Tuner | Certified Standard Tuning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tuner-body">
        <div class="header">
            <div class="brand">GYAVIIRA <span class="pro">PRO-TUNE</span></div>
            <div class="model">REF-440</div>
        </div>

        <div class="display-screen">
            <div class="note-display" id="currentNote">--</div>
            <div class="hz-display" id="currentHz">000.00 Hz</div>
        </div>

        <div class="strings-container">
            <!-- 6th String (Low E) -->
            <button class="string-btn" onclick="playTone(82.41, 'E2')">
                <span class="note">E</span>
                <span class="octave">2</span>
            </button>
            
            <!-- 5th String (A) -->
            <button class="string-btn" onclick="playTone(110.00, 'A2')">
                <span class="note">A</span>
                <span class="octave">2</span>
            </button>
            
            <!-- 4th String (D) -->
            <button class="string-btn" onclick="playTone(146.83, 'D3')">
                <span class="note">D</span>
                <span class="octave">3</span>
            </button>
            
            <!-- 3rd String (G) -->
            <button class="string-btn" onclick="playTone(196.00, 'G3')">
                <span class="note">G</span>
                <span class="octave">3</span>
            </button>
            
            <!-- 2nd String (B) -->
            <button class="string-btn" onclick="playTone(246.94, 'B3')">
                <span class="note">B</span>
                <span class="octave">3</span>
            </button>
            
            <!-- 1st String (High E) -->
            <button class="string-btn" onclick="playTone(329.63, 'E4')">
                <span class="note">E</span>
                <span class="octave">4</span>
            </button>
        </div>

        <div class="controls">
            <button class="stop-btn" onclick="stopAll()">SILENCE</button>
        </div>
        
        <div class="footer">
            Calibrated to A4 = 440Hz Standard
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
