<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyaviira Pro Tuner Suite</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="tuner-body">
        <div class="header">
            <div class="brand">GYAVIIRA <span class="pro">SUITE</span></div>
            <div class="model">MULTI-INSTRUMENT REFERENCE</div>
        </div>

        <!-- Instrument Selector -->
        <div class="instrument-tabs">
            <button class="tab-btn active" onclick="setInstrument('guitar')">GUITAR</button>
            <button class="tab-btn" onclick="setInstrument('bass4')">BASS-4</button>
            <button class="tab-btn" onclick="setInstrument('bass5')">BASS-5</button>
            <button class="tab-btn" onclick="setInstrument('violin')">VIOLIN</button>
            <button class="tab-btn" onclick="setInstrument('cello')">CELLO</button>
        </div>

        <div class="display-screen">
            <div class="note-display" id="currentNote">--</div>
            <div class="hz-display" id="currentHz">Select String</div>
        </div>

        <!-- Dynamic Strings Container -->
        <div class="strings-container" id="stringsContainer">
            <!-- Populated by JS -->
        </div>

        <div class="controls">
            <button class="stop-btn" onclick="stopAll()">SILENCE</button>
        </div>

        <div class="footer">
            Calibrated to A4 = 440Hz Standard • &copy; 2025 Gyaviira Foundation. All Rights Reserved.
            <br><br>
            <a href="/" class="return-btn">&larr; RETURN TO SITE</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
